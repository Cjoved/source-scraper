# Standalone Qdrant stack.
#
# Run separately from the app stack so vector storage can be started, stopped,
# and backed up independently.
#
# Common commands:
#   docker compose -f docker-compose.qdrant.yml up -d
#   docker compose -f docker-compose.qdrant.yml logs -f qdrant
#   docker compose -f docker-compose.qdrant.yml down
#
# App stack connection:
#   DOCKER_QDRANT_URL=http://host.docker.internal:6333

name: source-scraper-qdrant

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-vector-db
    ports:
      - "6333:6333"
      - "6334:6334"
    expose:
      - "6333"
      - "6334"
      - "6335"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    restart: unless-stopped

volumes:
  qdrant_storage:
