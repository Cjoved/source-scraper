# Local app stack for Source Scraper.
#
# This local compose assumes Qdrant and FlareSolverr are already running on
# your host machine. For deploy/staging with a FlareSolverr container, use:
#   docker compose -f docker-compose.deploy.yml up -d
#
# Optional local overrides:
#   DOCKER_QDRANT_URL=http://host.docker.internal:6333
#   DOCKER_FLARESOLVERR_URL=http://host.docker.internal:8191
#
# Common commands:
#   docker compose up -d
#   docker compose --profile scheduler up -d
#   docker compose --profile ui up -d
#   docker compose --profile scheduler --profile ui up -d

services:
  api:
    build:
      context: .
    container_name: source-scraper-api
    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "4",
      ]
    env_file:
      - .env
    environment:
      QDRANT_URL: ${DOCKER_QDRANT_URL:-http://host.docker.internal:6333}
      FLARESOLVERR_URL: ${DOCKER_FLARESOLVERR_URL:-http://host.docker.internal:8191}
      HEADLESS: "true"
      PRISM_HEADLESS: "true"
      PHILRICE_HEADLESS: "true"
      PHILRICE_NEWS_HEADLESS: "true"
      PINOYRICE_HEADLESS: "true"
      IRRI_HEADLESS: "true"
      OPENSTAT_HEADLESS: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Optional Chainlit demo UI (calls api:/v1/agent/chat). Not for public internet
  # without Chainlit auth; prefer SSH tunnel or 127.0.0.1 bind in prod.
  chainlit:
    build:
      context: .
    container_name: source-scraper-chainlit
    profiles:
      - ui
    command:
      [
        "chainlit",
        "run",
        "src/agent/ui_chainlit.py",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        "--headless",
      ]
    env_file:
      - .env
    environment:
      AGENT_UI_API_URL: ${AGENT_UI_API_URL:-http://api:8000/v1/agent/chat}
    ports:
      - "8001:8001"
    depends_on:
      - api
    restart: unless-stopped

  # Scraper/orchestrator worker. Runs scheduled scrape, validation, indexing,
  # backup, and alert jobs from orchestrator.yaml.
  scheduler:
    build:
      context: .
    container_name: source-scraper-scheduler
    command: ["python", "-m", "src.orchestrator", "serve"]
    profiles:
      - scheduler
    env_file:
      - .env
    environment:
      QDRANT_URL: ${DOCKER_QDRANT_URL:-http://host.docker.internal:6333}
      FLARESOLVERR_URL: ${DOCKER_FLARESOLVERR_URL:-http://host.docker.internal:8191}
      HEADLESS: "true"
      PRISM_HEADLESS: "true"
      PHILRICE_HEADLESS: "true"
      PHILRICE_NEWS_HEADLESS: "true"
      PINOYRICE_HEADLESS: "true"
      IRRI_HEADLESS: "true"
      OPENSTAT_HEADLESS: "true"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
