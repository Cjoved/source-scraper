# Deploy/staging app stack for Source Scraper.
#
# Qdrant runs separately (docker-compose.qdrant.yml). Join its Docker network so
# app containers can reach it by container name (127.0.0.1 publish is host-only).
#
#   DOCKER_QDRANT_URL=http://qdrant-vector-db:6333
#   QDRANT_DOCKER_NETWORK=qdrant_default
#   (Hostinger often uses qdrant_default; newer compose name: source-scraper-qdrant_default)
#
# Common commands:
#   docker compose -f docker-compose.deploy.yml up -d
#   docker compose -f docker-compose.deploy.yml --profile scheduler up -d
#   docker compose -f docker-compose.deploy.yml --profile ui up -d

networks:
  default:
  qdrant:
    external: true
    name: ${QDRANT_DOCKER_NETWORK:-qdrant_default}

services:
  api:
    build:
      context: .
    container_name: source-scraper-api
    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "4",
      ]
    env_file:
      - .env
    environment:
      QDRANT_URL: ${DOCKER_QDRANT_URL:-http://qdrant-vector-db:6333}
      FLARESOLVERR_URL: http://flaresolverr:8191
      HOME: /tmp
      HF_HOME: /tmp/huggingface
      FASTEMBED_CACHE_PATH: /tmp/fastembed
      HEADLESS: "true"
      PRISM_HEADLESS: "true"
      PHILRICE_HEADLESS: "true"
      PHILRICE_NEWS_HEADLESS: "true"
      PINOYRICE_HEADLESS: "true"
      IRRI_HEADLESS: "true"
      OPENSTAT_HEADLESS: "true"
    networks:
      - default
      - qdrant
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Optional Chainlit demo UI for verify/staging. Keep behind VPN/SSH tunnel;
  # do not publish widely without Chainlit password/OAuth.
  chainlit:
    build:
      context: .
    container_name: source-scraper-chainlit
    profiles:
      - ui
    command:
      [
        "chainlit",
        "run",
        "src/agent/ui_chainlit.py",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        "--headless",
      ]
    env_file:
      - .env
    environment:
      AGENT_UI_API_URL: ${AGENT_UI_API_URL:-http://api:8000/v1/agent/chat}
    networks:
      - default
    ports:
      - "8001:8001"
    depends_on:
      - api
    restart: unless-stopped

  # Scraper/orchestrator worker. Runs scheduled scrape, validation, indexing,
  # backup, and alert jobs from orchestrator.yaml.
  scheduler:
    build:
      context: .
    container_name: source-scraper-scheduler
    command: ["python", "-m", "src.orchestrator", "serve"]
    profiles:
      - scheduler
    env_file:
      - .env
    environment:
      QDRANT_URL: ${DOCKER_QDRANT_URL:-http://qdrant-vector-db:6333}
      FLARESOLVERR_URL: http://flaresolverr:8191
      HOME: /tmp
      HF_HOME: /tmp/huggingface
      FASTEMBED_CACHE_PATH: /tmp/fastembed
      HEADLESS: "true"
      PRISM_HEADLESS: "true"
      PHILRICE_HEADLESS: "true"
      PHILRICE_NEWS_HEADLESS: "true"
      PINOYRICE_HEADLESS: "true"
      IRRI_HEADLESS: "true"
      OPENSTAT_HEADLESS: "true"
    networks:
      - default
      - qdrant
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - flaresolverr

  flaresolverr:
    image: flaresolverr/flaresolverr:v3.3.21
    container_name: flaresolverr
    networks:
      - default
    # Internal network only — do not publish port 8191 in production.
    restart: unless-stopped
