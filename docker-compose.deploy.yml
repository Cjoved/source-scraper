# Deploy/staging app stack for Source Scraper.
#
# Qdrant is intentionally not defined here. Deploy Qdrant separately and set:
#   DOCKER_QDRANT_URL=http://<qdrant-host>:6333
#
# Common commands:
#   docker compose -f docker-compose.deploy.yml up -d
#   docker compose -f docker-compose.deploy.yml --profile scheduler up -d

services:
  api:
    build:
      context: .
    container_name: source-scraper-api
    command:
      [
        "uv",
        "run",
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "4",
      ]
    env_file:
      - .env
    environment:
      QDRANT_URL: ${DOCKER_QDRANT_URL:-http://host.docker.internal:6333}
      FLARESOLVERR_URL: http://flaresolverr:8191
      HEADLESS: "true"
      PRISM_HEADLESS: "true"
      PHILRICE_HEADLESS: "true"
      PHILRICE_NEWS_HEADLESS: "true"
      PINOYRICE_HEADLESS: "true"
      IRRI_HEADLESS: "true"
      OPENSTAT_HEADLESS: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Scraper/orchestrator worker. Runs scheduled scrape, validation, indexing,
  # backup, and alert jobs from orchestrator.yaml.
  scheduler:
    build:
      context: .
    container_name: source-scraper-scheduler
    command: ["uv", "run", "python", "-m", "src.orchestrator", "serve"]
    profiles:
      - scheduler
    env_file:
      - .env
    environment:
      QDRANT_URL: ${DOCKER_QDRANT_URL:-http://host.docker.internal:6333}
      FLARESOLVERR_URL: http://flaresolverr:8191
      HEADLESS: "true"
      PRISM_HEADLESS: "true"
      PHILRICE_HEADLESS: "true"
      PHILRICE_NEWS_HEADLESS: "true"
      PINOYRICE_HEADLESS: "true"
      IRRI_HEADLESS: "true"
      OPENSTAT_HEADLESS: "true"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - flaresolverr

  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    # Useful for staging smoke tests. In production, do not expose this port
    # publicly unless an external caller genuinely needs direct access.
    ports:
      - "8191:8191"
    restart: unless-stopped
