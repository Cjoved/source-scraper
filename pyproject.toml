[project]
name = "source-scraper"
version = "0.1.0"
description = "Modular PRiSM / Prism scrapers (HTTP yield export + optional Scrapling browser) with a FastAPI service for structured queries and hybrid semantic search over Qdrant."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "parsel>=1.9.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "pydantic>=2.13.4",
    "pandas>=3.0.3",
    "langchain-core>=1.4.8",
    "langchain-openai>=1.3.3",
    "langchain-deepseek>=1.1.0",
    "langchain-moonshot>=0.1.0",
    "langgraph>=1.2.6",
]

[project.optional-dependencies]
browser = [
    "scrapling[all]>=0.4.0",
    "tzdata>=2024.1",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "qdrant-client[fastembed]>=1.14",
    "pydantic-settings>=2.4",
    "slowapi>=0.1.9",
    "structlog>=24.1",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "qdrant-client[fastembed]>=1.14",
    "pydantic-settings>=2.4",
]
orchestrator = [
    "pyyaml>=6.0",
    "croniter>=2.0",
    "apscheduler>=3.10",
    "structlog>=24.1",
    "boto3>=1.35",
    "qdrant-client>=1.14",
    "pydantic-settings>=2.4",
]
openstat = [
    "playwright>=1.54",
    "playwright-stealth>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "openpyxl>=3.1",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.basedpyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
reportMissingImports = "warning"
